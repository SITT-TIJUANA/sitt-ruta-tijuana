<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SITT T101 — Modo presentación</title>
<style>
  :root{
    --guinda:#7B1D1D;
    --guinda-osc:#3d0d0d;
    --oro:#C9A84C;
    --oro-claro:#F5D77A;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  html,body{
    height:100%;
    overflow:hidden;
    background:#0c0505;
    font-family:"Segoe UI",system-ui,sans-serif;
  }

  /* ── Fondo ambiental ── */
  #fondo{
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 38%, rgba(123,29,29,.55), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(201,168,76,.10), transparent 60%),
      linear-gradient(160deg,#140707 0%,#0c0505 55%,#050202 100%);
    overflow:hidden;
  }
  #fondo::before{
    /* franja decorativa dorada arriba, discreta */
    content:"";
    position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--oro),transparent);
    opacity:.5;
  }
  .glow-particle{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(201,168,76,.9),transparent 70%);
    animation:flotar 9s ease-in-out infinite;
    opacity:.5;
  }
  @keyframes flotar{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-24px) scale(1.15)}
  }

  /* ── Marca en la esquina ── */
  #marca{
    position:fixed;top:26px;left:32px;z-index:5;
    display:flex;align-items:center;gap:12px;
    color:rgba(255,255,255,.55);
    animation:fadeIn 1s ease both;
  }
  #marca img{height:34px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
  #marca .txt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;line-height:1.5}
  #marca .txt b{display:block;color:var(--oro-claro);font-size:12px;letter-spacing:.1em}

  #salir{
    position:fixed;top:26px;right:32px;z-index:5;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.75);
    font-size:12px;font-weight:600;letter-spacing:.04em;
    padding:9px 16px;border-radius:20px;
    cursor:pointer;backdrop-filter:blur(6px);
    transition:all .2s ease;
    animation:fadeIn 1s ease both;
  }
  #salir:hover{background:rgba(255,255,255,.14);color:#fff}

  /* ── Escenario: centra y escala el teléfono a lo que quepa ── */
  #escenario{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    z-index:2;
  }
  #escala{
    transform-origin:center center;
    display:flex;flex-direction:column;align-items:center;
    gap:22px;
    animation:aparecer .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes aparecer{
    from{opacity:0;transform:translateY(18px) scale(.97)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* ── El teléfono ── */
  #telefono{
    position:relative;
    width:390px;height:844px;
    background:#0a0a0a;
    border-radius:56px;
    padding:14px;
    box-shadow:
      0 0 0 2px rgba(201,168,76,.35),
      0 30px 70px rgba(0,0,0,.7),
      0 0 90px rgba(123,29,29,.35),
      inset 0 0 0 1px rgba(255,255,255,.04);
  }
  /* botones laterales, puro detalle */
  #telefono::before, #telefono::after{
    content:"";position:absolute;background:#0a0a0a;
  }
  .btn-lateral{
    position:absolute;background:#151515;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .btn-lateral.silencio{width:3px;height:32px;left:-3px;top:118px;border-radius:2px 0 0 2px}
  .btn-lateral.vol-up{width:3px;height:56px;left:-3px;top:170px;border-radius:2px 0 0 2px}
  .btn-lateral.vol-down{width:3px;height:56px;left:-3px;top:238px;border-radius:2px 0 0 2px}
  .btn-lateral.power{width:3px;height:78px;right:-3px;top:190px;border-radius:0 2px 2px 0}

  #pantalla{
    position:relative;
    width:100%;height:100%;
    background:#000;
    border-radius:44px;
    overflow:hidden;
  }
  #dynamic-island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:120px;height:34px;background:#000;border-radius:20px;
    z-index:20;
    box-shadow:0 0 0 1px rgba(255,255,255,.03);
  }
  #home-indicator{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:134px;height:5px;background:rgba(255,255,255,.75);
    border-radius:4px;z-index:20;pointer-events:none;
  }
  iframe{
    width:100%;height:100%;border:none;display:block;background:#0f0f0f;
  }

  /* ── Pie ── */
  #pie{
    text-align:center;color:rgba(255,255,255,.4);
    animation:fadeIn 1.4s ease both;
  }
  #pie .ruta{
    font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--oro-claro);
    margin-bottom:3px;
  }
  #pie .sub{font-size:11px;letter-spacing:.03em}

  /* ── Loader inicial ── */
  #cargando{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:#0c0505;
    transition:opacity .5s ease;
  }
  #cargando .aro{
    width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(201,168,76,.25);
    border-top-color:var(--oro);
    animation:girar .9s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg)}}

  @media(max-height:700px){
    #marca,#salir{display:none}
  }
</style>
</head>
<body>

  <div id="fondo"></div>

  <div id="marca">
    <img src="logo-sitt.png" alt="SITT" onerror="this.style.display='none'">
    <div class="txt"><b>Modo presentación</b>Vista real de teléfono</div>
  </div>

  <button id="salir" onclick="if(document.fullscreenElement){document.exitFullscreen()}else{document.documentElement.requestFullscreen().catch(()=>{})}">⛶ Pantalla completa</button>

  <div id="cargando"><div class="aro"></div></div>

  <div id="escenario">
    <div id="escala">
      <div id="telefono">
        <div class="btn-lateral silencio"></div>
        <div class="btn-lateral vol-up"></div>
        <div class="btn-lateral vol-down"></div>
        <div class="btn-lateral power"></div>
        <div id="pantalla">
          <div id="dynamic-island"></div>
          <iframe src="index.html" title="SITT Tijuana Ruta T101" onload="document.getElementById('cargando').style.opacity=0;setTimeout(()=>document.getElementById('cargando').remove(),500)"></iframe>
          <div id="home-indicator"></div>
        </div>
      </div>
      <div id="pie">
        <div class="ruta">SITT TIJUANA · RUTA T101</div>
        <div class="sub">"Insurgentes – Puerta México"</div>
      </div>
    </div>
  </div>

<script>
// Partículas doradas ambientales, discretas
(function(){
  const fondo=document.getElementById('fondo');
  const n=14;
  for(let i=0;i<n;i++){
    const p=document.createElement('div');
    p.className='glow-particle';
    const s=Math.random()*3+1;
    p.style.width=s+'px';
    p.style.height=s+'px';
    p.style.left=Math.random()*100+'%';
    p.style.top=Math.random()*100+'%';
    p.style.animationDelay=(Math.random()*9)+'s';
    p.style.animationDuration=(7+Math.random()*6)+'s';
    fondo.appendChild(p);
  }
})();

// Escala el teléfono completo para que siempre quepa en la pantalla,
// sin importar si es una laptop chica o una tele gigante.
function ajustarEscala(){
  const disponibleAlto=window.innerHeight-64;   // margen arriba/abajo
  const disponibleAncho=window.innerWidth-64;   // margen a los lados
  const altoNatural=844+14*2+50; // teléfono + padding + pie de texto aprox
  const anchoNatural=390+14*2;
  const escala=Math.min(1.35, disponibleAlto/altoNatural, disponibleAncho/anchoNatural);
  document.getElementById('escala').style.transform='scale('+Math.max(escala,0.35)+')';
}
window.addEventListener('resize',ajustarEscala);
window.addEventListener('orientationchange',ajustarEscala);
ajustarEscala();
</script>

</body>
</html>
